<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>E-COMMERCE AI EMPIRE</title>
<style>
:root{
  --bg:#0b1120; --bg2:#0e1729; --card:#111c33; --line:#1e293b; --line2:#16213a;
  --tx:#e5e9f0; --mut:#8b98ad; --mut2:#64748b; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --acc:#38bdf8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 70px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:18px;margin:0;letter-spacing:.02em}
.brand b{color:var(--acc);font-weight:700}
.brand .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
.meta{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.15)}
nav{display:flex;gap:4px;overflow-x:auto;margin:16px 0 22px;padding-bottom:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid transparent;color:var(--mut);padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;font-size:13.5px}
nav button:hover{background:var(--bg2);color:var(--tx)}
nav button[aria-selected="true"]{background:var(--acc);color:#04121f;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card .v{font-size:25px;font-weight:650;margin-top:7px;font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--mut2);margin-top:3px}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.err{color:var(--err)} .v.acc{color:var(--acc)}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px;font-weight:600}
h2:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:11.5px;color:var(--mut2);margin-top:2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid;font-weight:600}
.p-ok{color:var(--ok);border-color:#166534;background:#052e16}
.p-warn{color:var(--warn);border-color:#78350f;background:#2a1a04}
.p-err{color:var(--err);border-color:#7f1d1d;background:#2a0a0a}
.p-mut{color:var(--mut);border-color:#334155;background:#0f172a}
.bar{height:6px;background:#1b2740;border-radius:999px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)}
.bar i.e{background:var(--err)}
.btn{background:var(--acc);color:#04121f;border:none;padding:9px 15px;border-radius:9px;font-weight:650;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:500}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:transparent;border:1px solid #7f1d1d;color:#fca5a5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:5px;font-weight:600}
input,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13.5px}
input:focus,select:focus{outline:2px solid rgba(56,189,248,.45);border-color:var(--acc)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);text-transform:none;letter-spacing:0}
.check input{width:auto}
.empty{color:var(--mut2);font-size:13px;padding:22px 4px;text-align:center}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.sec h3{margin:0 0 12px;font-size:14px;font-weight:650}
.hint{font-size:12px;color:var(--mut2);line-height:1.55;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}.wrap{padding:14px 12px 64px}.card .v{font-size:22px}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);background:#0f2740;border:1px solid var(--acc);color:var(--tx);padding:11px 18px;border-radius:11px;font-size:13.5px;transition:transform .25s;z-index:50;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut2);font-size:11.5px;line-height:1.6}
code{background:#0f172a;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>E-COMMERCE AI <b>EMPIRE</b></h1><span class="tag">v1.0 · local</span></div>
    <div class="meta">
      <span><i class="dot"></i><span id="hStatus">pronto</span></span>
      <span id="hUltima">sem execução</span>
      <span id="hDados">0 produtos</span>
    </div>
  </header>

  <nav id="nav" role="tablist"></nav>
  <main id="view"></main>

  <footer>
    App web independente · dados salvos neste navegador (localStorage) · sem servidor e sem login.<br>
    Motor determinístico: margem, preço para meta, estoque e checklist. Publicar, comprar e pagar exigem aprovação sua.
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var TAXAS = {
    shopee:       { nome:"Shopee",       comissao:0.14, fixo:4.0 },
    mercadolivre: { nome:"Mercado Livre", comissao:0.13, fixo:0.0 },
    loja:         { nome:"Loja própria",  comissao:0.0,  fixo:0.0 }
  };
  var CHAVE = "empire.v1";
  var PADRAO = {
    config: { meta:30, estoqueMin:3, canal:"shopee", investimento:1000 },
    produtos: [],
    aprovacoes: [],
    execucoes: [],
    ultimaRodada: null
  };
  var estado = carregar();
  var aba = "painel";

  function carregar(){
    try{
      var bruto = localStorage.getItem(CHAVE);
      if(!bruto) return JSON.parse(JSON.stringify(PADRAO));
      var d = JSON.parse(bruto);
      return Object.assign(JSON.parse(JSON.stringify(PADRAO)), d);
    }catch(e){ return JSON.parse(JSON.stringify(PADRAO)); }
  }
  function salvar(){
    try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }
    catch(e){ aviso("Não foi possível salvar neste navegador."); }
  }
  function id(){ return Math.random().toString(36).slice(2,10); }
  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function brl(v){ return "R$ " + num(v).toFixed(2).replace(".",","); }
  function pct(v){ return num(v).toFixed(2).replace(".",",") + "%"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function agora(){ return new Date().toISOString(); }
  function quando(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return esc(iso);
    return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
  }
  function hoje(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function aviso(txt){
    var t = document.getElementById("toast");
    t.textContent = txt; t.classList.add("show");
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  // ---------- motor determinístico ----------
  function taxa(canal){ return TAXAS[canal] || TAXAS.shopee; }

  function analisar(p, cfg){
    var c = cfg || estado.config;
    var t = taxa(p.canal);
    var custo = num(p.custo), preco = num(p.preco), estoque = num(p.estoque);
    var liquido = preco * (1 - t.comissao) - t.fixo - custo;
    var margem = preco > 0 ? (liquido / preco) * 100 : 0;
    var den = 1 - t.comissao - (num(c.meta)/100);
    var alvo = den > 0 ? (custo + t.fixo) / den : null;
    var bloq = [];
    if(custo <= 0) bloq.push("custo não cadastrado");
    if(preco <= 0) bloq.push("preço não cadastrado");
    if(custo>0 && preco>0 && liquido <= 0) bloq.push("preço abaixo do custo");
    if(custo>0 && preco>0 && liquido>0 && margem < num(c.meta)) bloq.push("margem "+pct(margem)+" abaixo da meta de "+num(c.meta)+"%");
    if(!p.descricaoOk) bloq.push("descrição do anúncio incompleta");
    if(estoque < num(c.estoqueMin)) bloq.push("estoque "+estoque+" un (mínimo "+num(c.estoqueMin)+")");
    var veredito = bloq.length === 0 ? "pronto" : (bloq.some(function(b){ return b.indexOf("custo")>=0 || b.indexOf("preço")>=0; }) ? "bloqueado" : "ajustar");
    return { produto:p, canal:t.nome, custo:custo, preco:preco, liquido:liquido, margem:margem, alvo:alvo, estoque:estoque, bloqueios:bloq, veredito:veredito };
  }

  function ativos(){ return estado.produtos.filter(function(p){ return p.status !== "pausado"; }); }

  function registrar(rotina, resumo, detalhe, ok){
    estado.execucoes.unshift({ id:id(), rotina:rotina, resumo:resumo, detalhe:detalhe, ok:!!ok, quando:agora() });
    estado.execucoes = estado.execucoes.slice(0, 200);
    estado.ultimaRodada = agora();
    salvar();
  }

  function rodarPlano(){
    var lista = ativos();
    if(!lista.length){ registrar("plano_de_venda","Nenhum produto ativo","Cadastre um produto para o motor calcular margem.", false); return {ok:false}; }
    var an = lista.map(function(p){ return analisar(p); });
    var prontos = an.filter(function(a){ return a.veredito==="pronto"; });
    var ajustar = an.filter(function(a){ return a.veredito==="ajustar"; });
    var bloq = an.filter(function(a){ return a.veredito==="bloqueado"; });
    var linhas = an.map(function(a){
      return "• "+a.produto.nome+" ("+a.canal+"): "+brl(a.preco)+" · lucro "+brl(a.liquido)+" · margem "+pct(a.margem)+" · "+a.veredito
        + (a.bloqueios.length ? " — "+a.bloqueios.join("; ") : "");
    });
    var abaixo = an.filter(function(a){ return a.alvo && a.margem < num(estado.config.meta); });
    if(abaixo.length){
      linhas.push(""); linhas.push("Preço para bater a meta:");
      abaixo.forEach(function(a){ linhas.push("• "+a.produto.nome+": "+brl(a.alvo)); });
    }
    var resumo = an.length+" produto(s): "+prontos.length+" prontos, "+ajustar.length+" a ajustar, "+bloq.length+" bloqueados";
    registrar("plano_de_venda", resumo, linhas.join("\n"), true);
    var novas = 0;
    prontos.forEach(function(a){
      var ja = estado.aprovacoes.some(function(x){ return x.produtoId===a.produto.id && x.status==="pendente"; });
      if(ja) return;
      estado.aprovacoes.unshift({ id:id(), produtoId:a.produto.id, produto:a.produto.nome, acao:"publicar_anuncio",
        detalhe:brl(a.preco)+" · lucro "+brl(a.liquido)+" · margem "+pct(a.margem), status:"pendente", quando:agora() });
      novas++;
    });
    if(novas) salvar();
    return { ok:true, resumo:resumo, novas:novas };
  }

  function rodarPendencias(){
    var lista = ativos(), pend = [];
    lista.forEach(function(p){
      var e = num(p.estoque);
      if(e < num(estado.config.estoqueMin)) pend.push(p.nome+": estoque "+e+" un (repor "+(num(estado.config.estoqueMin)-e)+")");
      if(!p.descricaoOk) pend.push(p.nome+": descrição do anúncio incompleta");
      if(!num(p.custo)) pend.push(p.nome+": custo não cadastrado");
      if(!num(p.preco)) pend.push(p.nome+": preço não cadastrado");
    });
    var abertas = estado.aprovacoes.filter(function(a){ return a.status==="pendente"; }).length;
    var detalhe = ["Produtos ativos: "+lista.length, "Aprovações aguardando decisão: "+abertas]
      .concat(pend.length ? ["","Pendências:"].concat(pend.map(function(x){ return "• "+x; })) : []).join("\n");
    registrar("pendencias", pend.length ? pend.length+" pendência(s) aberta(s)" : "nenhuma pendência aberta", detalhe, pend.length===0);
    return { resumo: pend.length+" pendência(s)" };
  }

  function rodarTudo(silencioso){
    var r = rodarPlano();
    rodarPendencias();
    render();
    if(!silencioso) aviso(r.ok ? "Ciclo executado: "+r.resumo : "Sem produtos ativos.");
  }

  // ---------- auto-execução ao abrir ----------
  function autoExecutar(){
    if(!estado.produtos.length && !estado.execucoes.length){
      var base = [
        { nome:"Livro de Colorir Adulto - Animais", custo:18.5, preco:39.9, estoque:10, categoria:"livros", descricaoOk:true },
        { nome:"Livro de Caligrafia - Iniciante", custo:16, preco:34.9, estoque:4, categoria:"livros", descricaoOk:true },
        { nome:"Kit 3 Livros Mandala", custo:42, preco:79.9, estoque:6, categoria:"livros", descricaoOk:false }
      ];
      base.forEach(function(b){
        estado.produtos.push(Object.assign({ id:id(), canal:"shopee", status:"ativo", origem:"exemplo", criado:agora() }, b));
      });
      salvar();
    }
    var ultima = estado.ultimaRodada ? new Date(estado.ultimaRodada) : null;
    var passouDoDia = !ultima || ultima.toDateString() !== new Date().toDateString();
    if(ativos().length && passouDoDia){
      rodarTudo(true);
      aviso("Rotina do dia executada automaticamente.");
    }
  }

  // ---------- componentes ----------
  function kpi(k, v, extra, cls){
    return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v '+(cls||"")+'">'+v+'</div>'
      + (extra ? '<div class="s">'+esc(extra)+'</div>' : '') + '</div>';
  }

  function barra(margem, meta){
    var largura = Math.max(2, Math.min(100, margem));
    var cls = margem >= meta ? "" : (margem > meta*0.6 ? "w" : "e");
    return '<div class="bar"><i class="'+cls+'" style="width:'+largura.toFixed(0)+'%"></i></div>';
  }

  function pill(veredito){
    var map = { pronto:["p-ok","pronto"], ajustar:["p-warn","ajustar"], bloqueado:["p-err","bloqueado"] };
    var m = map[veredito] || ["p-mut",veredito];
    return '<span class="pill '+m[0]+'">'+m[1]+'</span>';
  }

  // ---------- telas ----------
  function telaPainel(){
    var lista = ativos();
    var an = lista.map(function(p){ return analisar(p); });
    var prontos = an.filter(function(a){ return a.veredito==="pronto"; }).length;
    var pendentes = estado.aprovacoes.filter(function(a){ return a.status==="pendente"; }).length;
    var ultima = estado.execucoes[0];
    var margemMedia = an.length ? an.reduce(function(s,a){ return s + a.margem; },0)/an.length : 0;
    var lucroTotal = an.reduce(function(s,a){ return s + Math.max(0,a.liquido) * Math.max(0,a.estoque); },0);

    var html = '<div class="grid">'
      + kpi("Fornecedor", (CAT.meta ? Number(CAT.meta.total).toLocaleString("pt-BR") : "…"), "produtos lidos do site") + kpi("Produtos ativos", lista.length, (estado.produtos.length-lista.length)+" pausado(s)")
      + kpi("Prontos para vender", prontos, "margem ≥ "+num(estado.config.meta)+"%", prontos ? "ok":"warn")
      + kpi("Margem média", pct(margemMedia), "meta "+num(estado.config.meta)+"%", margemMedia>=num(estado.config.meta)?"ok":"warn")
      + kpi("Lucro potencial", brl(lucroTotal), "estoque × lucro unitário")
      + kpi("Aprovações", pendentes, pendentes ? "aguardando você" : "nada pendente", pendentes?"warn":"ok")
      + '</div>';

    html += '<div class="two"><div class="sec"><h3>Produtos e margem real</h3><div class="scroll">';
    if(!an.length){
      html += '<div class="empty">Nenhum produto ainda. Vá em <b>Produtos</b> e cadastre um, ou use o botão de exemplos.</div>';
    } else {
      html += '<table><thead><tr><th>Produto</th><th class="n">Preço</th><th class="n">Lucro</th><th class="n">Margem</th><th>Meta</th><th class="n">Preço p/ meta</th><th class="n">Estoque</th><th>Veredito</th></tr></thead><tbody>';
      an.forEach(function(a){
        html += '<tr><td><b>'+esc(a.produto.nome)+'</b><div class="sub">'+esc(a.canal)+' · '+(a.produto.origem==="real"?"dado real":"exemplo")+'</div></td>'
          + '<td class="n">'+brl(a.preco)+'</td>'
          + '<td class="n">'+brl(a.liquido)+'</td>'
          + '<td class="n '+(a.margem>=num(estado.config.meta)?"":"")+'" style="color:'+(a.margem>=num(estado.config.meta)?"var(--ok)":"var(--warn)")+'">'+pct(a.margem)+'</td>'
          + '<td style="min-width:80px">'+barra(a.margem, num(estado.config.meta))+'</td>'
          + '<td class="n">'+(a.alvo?brl(a.alvo):"—")+'</td>'
          + '<td class="n">'+a.estoque+'</td>'
          + '<td>'+pill(a.veredito)+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div><div class="hint">Margem já desconta a comissão do canal ('+(taxa("shopee").comissao*100)+'% na Shopee) e a tarifa fixa de '+brl(taxa("shopee").fixo)+'.</div></div>';

    html += '<div class="sec"><h3>Última execução automática</h3>';
    if(!ultima){ html += '<div class="empty">Nenhuma execução registrada.</div>'; }
    else {
      html += '<div class="row" style="justify-content:space-between;align-items:flex-start">'
        + '<div><b>'+esc(ultima.rotina)+'</b> · '+esc(ultima.resumo)+'<div class="sub">'+quando(ultima.quando)+'</div></div>'
        + '<span class="pill '+(ultima.ok?"p-ok":"p-warn")+'">'+(ultima.ok?"ok":"atenção")+'</span></div>'
        + '<pre style="white-space:pre-wrap;font:12.5px/1.6 ui-monospace,SFMono-Regular,monospace;color:var(--mut);margin:12px 0 0">'+esc(ultima.detalhe)+'</pre>';
    }
    html += '<div class="row" style="margin-top:14px"><button class="btn" onclick="EMPIRE.rodar()">Executar ciclo agora</button>'
      + '<button class="btn ghost" onclick="EMPIRE.ir(\'rotinas\')">Ver rotinas</button></div></div></div>';
    return html;
  }

  function telaProdutos(){
    var html = '<div class="sec"><h3>Novo produto</h3><div class="form">'
      + campo("f-nome","Nome do produto","text","")
      + campo("f-custo","Custo unitário (R$)","number","")
      + campo("f-preco","Preço de venda (R$)","number","")
      + campo("f-estoque","Estoque atual","number","0")
      + '<div><label>Canal</label><select id="f-canal">'
      + Object.keys(TAXAS).map(function(k){ return '<option value="'+k+'"'+(k==="shopee"?" selected":"")+'>'+TAXAS[k].nome+'</option>'; }).join("")
      + '</select></div>'
      + campo("f-cat","Categoria","text","")
      + '<div><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-desc" checked> Descrição pronta</label></div>'
      + '</div><div class="row"><button class="btn" onclick="EMPIRE.addProduto()">Adicionar produto</button>'
      + '<button class="btn ghost" onclick="EMPIRE.exemplos()">Carregar 3 exemplos</button></div>'
      + '<div class="hint">Deixe custo e preço reais para a margem ficar correta. Tarifas por canal já são aplicadas automaticamente.</div></div>';

    html += '<div class="sec"><h3>Catálogo ('+estado.produtos.length+')</h3><div class="scroll">';
    if(!estado.produtos.length){ html += '<div class="empty">Nenhum produto cadastrado.</div>'; }
    else {
      var an = estado.produtos.map(function(p){ return analisar(p); });
      html += '<table><thead><tr><th>Produto</th><th>Canal</th><th class="n">Custo</th><th class="n">Preço</th><th class="n">Margem</th><th class="n">Estoque</th><th>Status</th><th></th></tr></thead><tbody>';

  };

  function esperar(ms){
    return new Promise(function(res){ setTimeout(res, ms); });
  }

  // o leitor gratuito aceita ~20 leituras por minuto; 429 vira espera e nova tentativa
  function jina(url, tentativa){
    var t = tentativa || 0;
    return fetch(LEITOR + url, { headers: { "Accept": "text/plain" } }).then(function(r){
      if(r.status === 429 && t < 3){
        var pausa = 6000 * (t + 1);
        return esperar(pausa).then(function(){
          if(SCAN.estado === "rodando") logScan("Leitor pediu pausa, esperando " + (pausa / 1000) + "s para tentar de novo");
          return jina(url, t + 1);
        });
      }
      if(!r.ok) throw new Error("leitor HTTP " + r.status);
      return r.text();
    });
  }

  function brNum(s){
    if(!s) return null;
    var v = parseFloat(String(s).replace(/\./g, "").replace(",", "."));
    return isFinite(v) ? v : null;
  }

  // "![Image 1: Nome](cdn.jpg)](https://.../produto/p)" -> {nome, img, url}
  function parseLista(md){
    var re = /!\[Image \d+: ([^\]]+?)\]\((https:\/\/cdn[^)]+?\.(?:jpg|jpeg|png|webp))\)\]\((https:\/\/www\.[^)]+?\/p)(?:#[^)]*)?\)/g;
    var m, vistos = {}, itens = [];
    while((m = re.exec(md))){
      var nome = m[1].replace(/\s+\d+$/, "").trim();
      var url = m[3];
      if(vistos[url] || nome.length < 12) continue;
      vistos[url] = 1;
      itens.push({ nome: nome, img: m[2], url: url });
    }
    return itens;
  }

  // página de produto -> dados de custo, faixas e demanda
  function parseProduto(md, base){
    var nome = (md.match(/^#\s+(.+)$/m) || [])[1];
    var ref = (md.match(/Ref\.?\s+([\d\.]{4,})/) || [])[1] || "";
    var vend = md.match(/\+ de\s*([\d\.]+)\s*vendidos/);
    var nota = md.match(/\b([45]\.\d)\s*\+?\s*de\s*[\d\.]+\s*vendidos/);
    var par = md.match(/R\$\s?([\d\.]+,\d{2})\s*-?\d+\s*%\s*R\$\s?([\d\.]+,\d{2})/);
    var tiers = [], re = /\|\s*(\d+)\s*(?:-\s*(\d+)|(\+))\s*\|\s*-?\d+\s*%\s*\|\s*R\$\s?([\d\.]+,\d{2})/g, m;
    while((m = re.exec(md))){
      tiers.push([parseInt(m[1], 10), brNum(m[4])]);
    }
    var imgGrande = (md.match(/!\[Image \d+: [^\]]*\]\((https:\/\/cdn[^)]+?-large_default\.jpg)\)/) || [])[1];
    var desc = "";
    var iDesc = md.search(/###?\s*Descri[çc][ãa]o/);
    if(iDesc > 0){
      desc = md.slice(iDesc, iDesc + 700).replace(/###?\s*Descri[çc][ãa]o/, "").replace(/\[[^\]]*\]\([^)]*\)/g, "").replace(/\s+/g, " ").trim();
    }
    return {
      nome: (nome || base.nome || "").trim(),
      url: base.url, img: imgGrande || base.img,
      ref: ref, vendidos: vend ? parseInt(vend[1].replace(/\./g, ""), 10) : null,
      nota: nota ? parseFloat(nota[1]) : null,
      referencia: par ? brNum(par[1]) : null,
      tiers: tiers.length ? tiers : (par ? [[1, brNum(par[2])]] : []),
      descricao: desc
    };
  }

  function riscoDe(nome){
    var n = nome.toLowerCase();
    if(/piscina|inflav|arvore de natal|árvore de natal|colchao|colchão|guarda-roupa|estante|mesa |cadeira/.test(n))
      return { nivel: "alto", motivo: "volumoso: frete caro e devolução difícil", peso: 0.45 };
    if(/natal|halloween|pascoa|páscoa|carnaval/.test(n))
      return { nivel: "alto", motivo: "sazonal: encalha depois da data", peso: 0.55 };
    if(/127v|220v|110v|eletr/.test(n))
      return { nivel: "medio", motivo: "elétrico: mais devolução e garantia", peso: 0.75 };
    if(/vidro|ceramica|cerâmica|porcelana/.test(n))
      return { nivel: "medio", motivo: "frágil: risco de quebra no envio", peso: 0.8 };
    return { nivel: "baixo", motivo: "leve e simples de enviar", peso: 1 };
  }

  function custoFaixa(item, qtd){
    if(!item.tiers || !item.tiers.length) return null;
    var preco = item.tiers[0][1];
    item.tiers.forEach(function(t){ if(qtd >= t[0] && t[1]) preco = t[1]; });
    return preco;
  }

  function tarifa(canal, p){
    if(canal === "Shopee") return 0.14 * p + 4;
    if(canal === "Mercado Livre") return 0.13 * p + (p < 79 ? 6 : 0);
    return p < 50 ? 0.10 * p + 4 : 0.06 * p + 6;
  }

  function precoParaMeta(custo, canal, metaPct){
    var meta = num(metaPct) / 100, p = Math.max(custo * 1.5, 25);
    for(var i = 0; i < 60; i++){
      var com = canal === "Shopee" ? 0.14 : canal === "Mercado Livre" ? 0.13 : (p < 50 ? 0.10 : 0.06);
      var fixo = canal === "Shopee" ? 4 : (canal === "Mercado Livre" ? (p < 79 ? 6 : 0) : (p < 50 ? 4 : 6));
      var den = 1 - com - meta;
      if(den <= 0.02) return null;
      var novo = (custo + fixo) / den;
      if(Math.abs(novo - p) < 0.02){ p = novo; break; }
      p = novo;
    }
    return Math.round(p * 100) / 100;
  }

  // analisa um produto em todos os canais, no preço de venda de referência
  function analisarItem(item, cfg){
    var custo = custoFaixa(item, cfg.qtd);
    var fator = num(cfg.markup) || 3;
    var venda = custo ? Math.round(custo * fator * 100) / 100 : 0;
    if(!custo || !venda) return null;
    var out = { item: item, custo: custo, venda: venda, canais: {}, qtd: cfg.qtd };
    ["Shopee", "Mercado Livre", "TikTok Shop"].forEach(function(canal){
      var lucro = venda - tarifa(canal, venda) - custo;
      out.canais[canal] = {
        lucro: Math.round(lucro * 100) / 100,
        margem: Math.round(lucro / venda * 1000) / 10,
        precoMeta: precoParaMeta(custo, canal, cfg.meta),
        viavel: precoParaMeta(custo, canal, cfg.meta) !== null && precoParaMeta(custo, canal, cfg.meta) <= venda
      };
    });
    out.melhor = ["Shopee", "Mercado Livre", "TikTok Shop"].reduce(function(a, b){
      return out.canais[b].lucro > out.canais[a].lucro ? b : a;
    }, "Shopee");
    out.unidades = Math.max(1, Math.floor(num(cfg.orcamento) / custo));
    out.lucroOrcamento = Math.round(out.unidades * out.canais[out.melhor].lucro * 100) / 100;
    out.risco = riscoDe(item.nome);
    out.pontuacao = Math.round(out.lucroOrcamento * out.risco.peso * 100) / 100;
    out.demanda = item.vendidos || 0;
    out.referenciaFornecedor = item.referencia || null;
    out.markup = fator;
    return out;
  }

  function categoriaDe(nome){
    var n = nome.toLowerCase();
    var mapa = [
      [["caixa de som","fone","headset","microfone","bluetooth"], "Áudio"],
      [["carregador","cabo","power bank","suporte de celular","película"], "Celular e acessórios"],
      [["canetinha","caneta","lápis","lapis","giz","massa de modelar","caderno","diário","lousa","tablet lcd","estojo","papelaria","colorir"], "Papelaria"],
      [["squishy","brinquedo","pião","piao","bloco","bola","carrinho","boneca","pula pula","peteca"], "Brinquedos"],
      [["mochila","lancheira","bolsa","carteira","necessaire","chaveiro"], "Bolsas e mochilas"],
      [["panela","grill","sanduicheira","chaleira","air fryer","liquidificador"], "Cozinha"],
      [["furadeira","jogo de chaves","chave de fenda","chave inglesa","kit ferramentas","maleta","parafusadeira","alicate"], "Ferramentas"],
      [["smartwatch","relógio","relogio"], "Relógios"],
      [["umidificador","aromatizador","luminária","led"], "Casa"],
      [["bola de futebol","halteres","yoga","elástico"], "Esporte"]
    ];
    for(var i = 0; i < mapa.length; i++){
      for(var j = 0; j < mapa[i][0].length; j++){
        if(n.indexOf(mapa[i][0][j]) >= 0) return mapa[i][1];
      }
    }
    return "Utilidades";
  }

  var BENEFICIOS = {
    "Áudio": ["Som potente e som limpo no volume alto", "Conexão Bluetooth estável, sem cabo", "Bateria com autonomia para o dia todo", "Compacto: cabe na mochila e vai para qualquer lugar"],
    "Celular e acessórios": ["Carregamento rápido todos os dias", "Cabo reforçado, não descasca no uso", "Compatível com Android e iPhone", "Compacto para levar na bolsa ou no bolso"],
    "Bolsas e mochilas": ["Tecido resistente e costura reforçada", "Vários compartimentos organizados", "Alças ajustáveis e confortáveis", "Estampa exclusiva, ótimo para presente"],
    "Brinquedos": ["Diversão garantida para crianças", "Material firme e seguro", "Ajuda no desenvolvimento e na coordenação", "Ótima opção de presente que cabe no bolso"],
    "Papelaria": ["Ideal para escola, escritório e presente", "Acabamento caprichado", "Material durável no uso diário", "Compacto para levar na mochila"],
    "Cozinha": ["Facilita o dia a dia na cozinha", "Acabamento antiaderente e fácil de limpar", "Compacto, ocupa pouco espaço", "Bivolt/127V com uso simples"],
    "Ferramentas": ["Kit completo para serviços em casa", "Material resistente, uso profissional", "Maleta organizadora inclusa", "Ótimo custo-benefício para quem faz tudo sozinho"],
    "Relógios": ["Tela ampla e brilhante", "Notificações e monitoramento no pulso", "Bateria para vários dias", "Pulseiras extras no kit"],
    "Casa": ["Deixa o ambiente mais confortável", "Design moderno que combina com tudo", "Fácil de usar e limpar", "Ótimo para presentear"],
    "Esporte": ["Perfeito para treino e lazer", "Material resistente", "Fácil de transportar", "Serve para toda a família"],
    "Utilidades": ["Produto útil no dia a dia", "Bom acabamento", "Preço acessível", "Pronto para envio"]
  };

  function limparNome(nome){
    return nome.replace(/\s+/g, " ").replace(/\b(Atacado|Revenda)\b/gi, "").trim();
  }

  function gerarAnuncio(analise, canal){
    var item = analise.item;
    var nome = limparNome(item.nome);
    var cat = categoriaDe(nome);
    var beneficios = BENEFICIOS[cat] || BENEFICIOS.Utilidades;
    var preco = analise.venda;
    var titulo = nome;
    if(canal === "Mercado Livre") titulo = nome + " - Pronto Entrega";
    if(canal === "Shopee") titulo = nome + " | Envio Rápido";
    if(titulo.length > 60) titulo = titulo.slice(0, 60).trim();
    var linhas = [
      nome,
      "",
      "Por que vale a pena:",
    ].concat(beneficios.map(function(b){ return "• " + b; }));
    linhas = linhas.concat([
      "",
      "Detalhes:",
      "• Produto novo, conferido antes do envio",
      "• Embalagem protegida",
      "• Envio em até 24h úteis após a confirmação",
      "",
      "Preço mínimo para bater a meta de margem: R$ " + (analise.canais[canal].precoMeta || 0).toFixed(2).replace(".", ","),
      "",
      "Garantia e troca conforme as regras do marketplace.",
      "",
      canal === "TikTok Shop"
        ? "Compre pelo carrinho da loja e receba em casa."
        : "Clique em comprar e receba em casa."
    ]);
    var hashtags = ["#achadinhos", "#promocao", "#" + cat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, ""), "#brasil", "#enviorapido"];
    if(canal === "TikTok Shop") hashtags.unshift("#tiktokshop", "#achadinhosdatiktok");
    return {
      titulo: titulo,
      preco: preco,
      descricao: linhas.join("\n"),
      hashtags: hashtags.join(" "),
      categoria: cat
    };
  }

  function textoAnuncio(analise, canal){
    var a = gerarAnuncio(analise, canal);
    return "TÍTULO (" + canal + ")\n" + a.titulo + "\n\nPREÇO SUGERIDO\nR$ " + a.preco.toFixed(2).replace(".", ",") + "\n\nDESCRIÇÃO\n" + a.descricao + (canal === "TikTok Shop" ? "\n\n" + a.hashtags : "");
  }

  // ---------- execução do escaneamento ----------
  function logScan(msg){
    SCAN.log.push({ t: new Date().toLocaleTimeString("pt-BR"), m: msg });
    render();
  }

  function escanear(){
    if(SCAN.estado === "rodando") return;
    var cfg = {
      meta: num((document.getElementById("s-meta") || {}).value) || 30,
      orcamento: num((document.getElementById("s-orcamento") || {}).value) || 1000,
      qtd: num((document.getElementById("s-qtd") || {}).value) || 1,
      markup: num((document.getElementById("s-markup") || {}).value) || 3,
      detalhar: num((document.getElementById("s-detalhar") || {}).value) || 6
    };
    SCAN = { estado: "rodando", log: [], itens: [], erro: "", quando: null, alvo: cfg, fonte: "" };
    logScan("Conectando ao fornecedor " + FORNECEDOR.replace("https://www.", ""));

    jina(FORNECEDOR + "/mais-vendidos")
      .then(function(md){
        var lista = parseLista(md);
        if(!lista.length) throw new Error("a vitrine veio vazia");
        SCAN.fonte = "ao vivo";
        logScan("Vitrine de mais vendidos lida: " + lista.length + " produtos encontrados");
        var alvos = lista.slice(0, Math.max(1, Math.min(12, cfg.detalhar)));
        var seq = Promise.resolve();
        alvos.forEach(function(prod, idx){
          seq = seq.then(function(){
            logScan("Abrindo " + (idx + 1) + "/" + alvos.length + ": " + prod.nome.slice(0, 42));
            return jina(prod.url)
              .then(function(pg){
                var det = parseProduto(pg, prod);
                if(!det.tiers.length){ logScan("Sem tabela de preço em " + prod.nome.slice(0, 30) + ", pulando"); return; }
                var an = analisarItem(det, cfg);
                if(an) SCAN.itens.push(an);
                render();
              })
              .catch(function(e){ logScan("Falhou em " + prod.nome.slice(0, 34) + " (" + e.message + ")"); })
              .then(function(){ return esperar(1500); });
          });
        });
        return seq;
      })
      .then(function(){
        if(!SCAN.itens.length) throw new Error("nenhum produto com preço legível");
        SCAN.itens.sort(function(a, b){ return b.pontuacao - a.pontuacao; });
        SCAN.estado = "pronto";
        SCAN.quando = agora();
        salvarScan();
        logScan("Análise concluída: " + SCAN.itens.length + " produtos comparados");
      })
      .catch(function(e){
        SCAN.erro = e.message || String(e);
        logScan("Falhou: " + SCAN.erro + " — usando catálogo salvo de 08/11");
        usarSnapshot(cfg);
      })
      .then(function(){ render(); });
  }

  function usarSnapshot(cfg){
    var itens = SNAPSHOT.map(function(s){ return analisarItem(s, cfg); }).filter(Boolean);
    itens.sort(function(a, b){ return b.pontuacao - a.pontuacao; });
    SCAN.itens = itens;
    SCAN.estado = itens.length ? "pronto" : "falhou";
    SCAN.fonte = "catálogo salvo (08/11/2026)";
    SCAN.quando = agora();
    salvarScan();
  }

  function salvarScan(){
    try{
      localStorage.setItem("empire.scan", JSON.stringify({ itens: SCAN.itens, quando: SCAN.quando, fonte: SCAN.fonte, alvo: SCAN.alvo }));
    }catch(e){}
  }

  function carregarScan(){
    try{
      var d = JSON.parse(localStorage.getItem("empire.scan") || "null");
      if(d && d.itens && d.itens.length){
        SCAN.itens = d.itens; SCAN.quando = d.quando; SCAN.fonte = d.fonte; SCAN.alvo = d.alvo;
        SCAN.estado = "pronto";
      }
    }catch(e){}
  }

    CAT.lista.forEach(function(p){ if(p.c && categorias.indexOf(p.c) < 0) categorias.push(p.c); });
    categorias.sort(function(a,b){ return a === "Todos" ? -1 : a.localeCompare(b); });

    var lista = catFiltrada();
    var totalPag = Math.max(1, Math.ceil(lista.length / CAT.porPagina));
    if(CAT.pagina > totalPag - 1) CAT.pagina = 0;
    var inicio = CAT.pagina * CAT.porPagina;
    var pagina = lista.slice(inicio, inicio + CAT.porPagina);

    var html = '<div class="panel">' +
      '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">' +
      '<h3 style="margin:0">Catálogo do fornecedor</h3>' +
      '<span class="pill">' + (CAT.meta ? Number(CAT.meta.total).toLocaleString("pt-BR") + " produtos" : "") +
      (CAT.meta ? " · atualizado " + CAT.meta.atualizado : "") + '</span></div>' +
      '<p class="muted" style="margin:8px 0 0">Lido do sitemap de ' + esc(CAT.meta ? CAT.meta.fonte : "feiradamadrugadasp.com.br") +
      '. Use a busca e o botão Analisar para puxar preço, margem nos três canais e anúncio pronto.</p>' +
      (CAT.erro ? '<p style="color:#b91c1c;margin:8px 0 0">' + esc(CAT.erro) + '</p>' : '') +
      '<div class="row" style="margin-top:12px"><div>' +
      '<label for="cat-busca">Buscar produto</label>' +
      '<input id="cat-busca" placeholder="ex: canetinha, mochila, squishy" value="' + esc(CAT.filtro) + '"' +
      ' oninput="EMF.fornecedorBuscar(this.value)"></div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' +
      categorias.map(function(c){
        return '<button class="tab' + (CAT.cat === c ? " on" : "") + '" style="padding:6px 10px;font-size:12px"' +
          ' onclick="EMF.fornecedorCat(\'' + esc(c) + '\')">' + esc(c) + '</button>';
      }).join("") +
      '</div></div>';

    if(CAT.analise){
      var a = CAT.analise;
      html += '<div class="panel" style="border-left:3px solid var(--accent,#0f766e)">' +
        '<div class="winner">' + (a.item.img ? '<img src="' + esc(a.item.img) + '" alt="" onerror="this.style.display=\'none\'">' : '') +
        '<div style="flex:1"><h3 style="margin:0 0 4px">' + esc(a.item.nome) + '</h3>' +
        '<p class="muted" style="margin:0 0 8px">vendedor: ' + (a.item.vendidos || "—") + ' vendidos · nota ' + (a.item.nota || "—") +
        ' · ref ' + esc(a.item.ref || "—") + '</p>' +
        '<div class="kpis" style="margin:0">' + kpi("Custo (1 a 3 un)", brl(a.custo), a.custo10 ? "10+ un: " + brl(a.custo10) : "") +
        kpi("Venda sugerida", brl(a.venda), cfgScan().markup + "x o custo") +
        kpi("Melhor canal", a.melhor, brl(a.canais[a.melhor].lucro) + " por peça") +
        kpi("Margem", pct(a.canais[a.melhor].margem) + "%", "meta " + cfgScan().meta + "%") + '</div>' +
        '<div class="row" style="margin-top:10px">' +
        '<a class="btn ghost" href="' + esc(a.item.url) + '" target="_blank" rel="noopener">Abrir no fornecedor</a>' +
        '<button class="btn" onclick="EMF.aplicarAoCatalogo(' + CAT.idAnalise + ')">Usar no meu catálogo</button>' +
        '<button class="btn ghost" onclick="EMF.copiarAnuncio(' + CAT.idAnalise + ',\'' + a.melhor + '\')">Copiar anúncio ' + a.melhor + '</button>' +
        '</div></div></div>' +
        '<div class="grid" style="margin-top:12px">' + Object.keys(a.canais).map(function(c){
          var v = a.canais[c];
          return '<div class="card"><strong>' + esc(c) + '</strong>' +
            '<p class="muted" style="margin:4px 0">lucro ' + brl(v.lucro) + ' · margem ' + fmt(v.margem) + '%</p>' +
            '<p style="margin:0">preço p/ ' + cfgScan().meta + '%: <strong>' + brl(v.precoMeta) + '</strong></p>' +
            '<p class="muted" style="margin:4px 0 0">' + (v.viavel ? "viável no preço de venda" : "precisa subir o preço") + '</p></div>';
        }).join("") + '</div></div>';
    }

    html += '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">' +
      '<strong>' + lista.length + ' produto(s)</strong>' +
      '<span class="muted">página ' + (CAT.pagina + 1) + ' de ' + totalPag + '</span></div>' +
      '<div class="grid" style="margin-top:10px">' +
      pagina.map(function(p){
        var idx = CAT.lista.indexOf(p);
        return '<div class="card">' +
          (p.i ? '<img src="' + esc(p.i) + '" alt="" loading="lazy" style="width:100%;height:150px;object-fit:contain;background:#fff;border-radius:8px" onerror="this.style.display=\'none\'">' : '') +
          '<p style="margin:8px 0 2px;font-weight:600;font-size:13px">' + esc(p.n) + '</p>' +
          '<p class="muted" style="margin:0 0 8px;font-size:12px">' + esc(p.c || "—") + '</p>' +
          '<button class="btn ghost" style="width:100%;padding:6px" onclick="EMF.analisarProduto(' + idx + ')">Analisar</button></div>';
      }).join("") + '</div>' +
      (totalPag > 1 ? '<div class="row" style="margin-top:12px">' +
        (CAT.pagina > 0 ? '<button class="btn ghost" onclick="EMF.fornecedorPagina(' + (CAT.pagina - 1) + ')">Anterior</button>' : '') +
        (CAT.pagina < totalPag - 1 ? '<button class="btn ghost" onclick="EMF.fornecedorPagina(' + (CAT.pagina + 1) + ')">Próxima</button>' : '') +
        '</div>' : '') +
      '</div>';
    return html;
  }

  window.EMF = {
    fornecedorBuscar: function(v){
      clearTimeout(window.__catTimer);
      window.__catTimer = setTimeout(function(){ CAT.filtro = v; CAT.pagina = 0; render(); }, 220);
    },
    fornecedorCat: function(c){ CAT.cat = c; CAT.pagina = 0; render(); },
    fornecedorPagina: function(n){ CAT.pagina = Math.max(0, n); render(); },
    analisarProduto: function(idx){
      var p = CAT.lista[idx];
      if(!p) return;
      CAT.idAnalise = idx; CAT.analisando = true; CAT.analise = null; render();
      jina(p.u)
        .then(function(md){
          var det = parseProduto(md, { nome: p.n, img: p.i, url: p.u });
          if(!det.tiers.length) throw new Error("o fornecedor não mostrou preço nesta página");
          CAT.analise = analisarItem(det, cfgScan());
          CAT.analise.item.img = det.imagem || p.i;
        })
        .catch(function(e){
          CAT.analise = null;
          CAT.erro = "Falhou em " + p.n + ": " + e.message;
        })
        .then(function(){ CAT.analisando = false; render(); });
    },
    aplicarAoCatalogo: function(idx){
      if(!CAT.analise) return;
      aplicarProdutoAoMeuCatalogo(CAT.analise);
      CAT.analise = null; render();
    },
    copiarAnuncio: function(idx, canal){
      if(!CAT.analise) return;
      var an = gerarAnuncio(CAT.analise, canal);
      var txt = an.titulo + "\n\n" + an.descricao + "\n\n" + an.hashtags + "\n\nPreço: " + brl(an.preco);
      if(navigator.clipboard) navigator.clipboard.writeText(txt);
      logScan("Anúncio " + canal + " copiado.");
      render();
    },
  };

  try {
    var inicial = ("" + location.hash).replace("#","");
    if(inicial && ABAS.some(function(a){ return a[0] === inicial; })) aba = inicial;
  } catch(e){}
  window.addEventListener("hashchange", function(){
    var h = ("" + location.hash).replace("#","");
    if(ABAS.some(function(a){ return a[0] === h; })){ aba = h; render(); }
  });
  carregarCatalogo();
  render();
  autoExecutar();
})();
</script>
</body>
</html>
