# Rotina DIÁRIA (GitHub Actions - plano gratuito).
# 11:00 UTC = 08:00 em America/Sao_Paulo.
#
# Observação importante: o runner do Actions é efêmero. Para o histórico
# sobreviver entre execuções, configure DATABASE_BACKEND=supabase nos secrets
# (plano gratuito do Supabase) ou use o artefato do banco anexado ao run.
name: rotina-diaria

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: rotina-diaria
  cancel-in-progress: false

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Carregar catálogo (CSV versionado ou Supabase)
        run: python -m scripts.daily_analysis
        env:
          DATABASE_BACKEND: ${{ vars.DATABASE_BACKEND || 'sqlite' }}
          SQLITE_PATH: data/empire.db
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'gemini,offline' }}
          APP_TIMEZONE: America/Sao_Paulo
      - name: Guardar banco e saída do run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-analysis-${{ github.run_id }}
          path: |
            data/empire.db
            data/empire.db-wal
            data/empire.db-shm
          retention-days: 14
          if-no-files-found: ignore
