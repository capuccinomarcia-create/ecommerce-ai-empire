# Rotina SEMANAL: concorrência, margens, relatório financeiro e plano de conteúdo.
# 12:00 UTC de segunda = 09:00 em America/Sao_Paulo.
name: rotina-semanal

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: rotina-semanal
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gerar relatório semanal
        run: python -m scripts.weekly_report
        env:
          DATABASE_BACKEND: ${{ vars.DATABASE_BACKEND || 'sqlite' }}
          SQLITE_PATH: data/empire.db
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'gemini,offline' }}
          APP_TIMEZONE: America/Sao_Paulo
      - name: Guardar saída do run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            data/empire.db
            data/empire.db-wal
            data/empire.db-shm
          retention-days: 30
          if-no-files-found: ignore
