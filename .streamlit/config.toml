# Tema do painel (Streamlit). Não contém segredos.
[theme]
base = "light"
primaryColor = "#1F6F5C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
enableCORS = true

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
